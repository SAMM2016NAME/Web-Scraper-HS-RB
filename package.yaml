name:                web-scraper-hs-rb
version:             0.1.0.0
github:              "yourname/web-scraper-hs-rb"
license:             MIT
author:              "web-scraper-hs-rb Contributors"
maintainer:          "example@example.com"
copyright:           "2026 web-scraper-hs-rb Contributors"

extra-source-files:
- README.md

synopsis:            A hybrid Haskell/Ruby web scraping and data processing pipeline
category:            Web

description: >
  web-scraper-hs-rb orchestrates fleets of Ruby scraper processes from a
  type-safe, concurrent Haskell core, cleans and validates the scraped
  data, and loads it into SQLite. See README.md for full documentation.

dependencies:
- base >= 4.14 && < 5
- aeson
- sqlite-simple
- stm
- optparse-applicative
- process
- bytestring
- text
- time
- containers
- directory
- unix

ghc-options:
- -Wall
- -Wcompat
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wredundant-constraints
- -threaded
- -rtsopts
- "-with-rtsopts=-N"

library:
  source-dirs: src

executables:
  web-scraper-hs-rb-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - "-with-rtsopts=-N"
    dependencies:
    - web-scraper-hs-rb

tests:
  web-scraper-hs-rb-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - "-with-rtsopts=-N"
    dependencies:
    - web-scraper-hs-rb
    - hspec
